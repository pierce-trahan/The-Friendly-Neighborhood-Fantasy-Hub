[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "friendly-neighborhood-fantasy-hub"
version = "0.1.0"
description = "Local-first fantasy football decision-support application"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3",
  "jsonschema>=4.25,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1"
]

[project.scripts]
friendly-hub = "friendly_hub.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/friendly_hub"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
